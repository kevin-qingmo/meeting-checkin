<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 会议扫码签到系统</title>
  <link rel="icon" href="{{ url_for('static', filename='img_school_logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">
    <img class="school-logo" src="{{ url_for('static', filename='img_school_logo.png') }}" alt="天津海河教育园区南开学校校徽">
    <div class="brand-text">
      <div class="school-name">天津海河教育园区南开学校</div>
      <div class="app-name">会议扫码签到系统</div>
    </div>
  </div>
  <div class="login-card">
    <h1>教师登录</h1>
    <div class="sub">南开学校 · 会议 / 活动快速签到</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('auth.login') }}{% if next %}?next={{ next }}{% endif %}">
      <div class="field">
        <label>用户名</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">登录</button>
    </form>
  </div>
</div>
</body>
</html>
